<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kuis Pintar Anak 🌟</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HOME SCREEN -->
  <div id="screen-home" class="screen active">
    <div class="home-bg">
      <div class="cloud cloud1">☁️</div>
      <div class="cloud cloud2">☁️</div>
      <div class="cloud cloud3">☁️</div>
      <div class="star-float s1">⭐</div>
      <div class="star-float s2">🌟</div>
      <div class="star-float s3">✨</div>
    </div>
    <div class="home-content">
      <div class="home-mascot">🦁</div>
      <div class="home-title">Kuis Pintar<span>Anak</span> Hebat!</div>
      <div class="home-subtitle">Yuk belajar sambil bermain! 🎉</div>
      <div id="category-grid" class="category-grid"></div>
    </div>
  </div>

  <!-- LEVEL SELECT SCREEN -->
  <div id="screen-level-select" class="screen">
    <div class="quiz-header">
      <button class="btn-back" onclick="goHome()">← Kembali</button>
      <span id="level-select-category-label" class="quiz-category-label">Hewan</span>
      <div style="width: 60px;"></div>
    </div>
    <div id="level-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 20px; margin: 0 auto; max-width: 600px; width: 100%;"></div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="screen-quiz" class="screen">
    <div class="quiz-header">
      <button class="btn-back" onclick="goLevelSelect()">← Kembali</button>
      <span id="quiz-category-label" class="quiz-category-label">Hewan - Level 1</span>
      <span id="score-mini" class="quiz-score-mini">0</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"></div>
      <div id="progress-text" class="progress-text">Soal 1 dari 5</div>
    </div>
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px;">
      <div id="quiz-card" class="quiz-card">
        <span id="question-emoji" class="question-emoji">🐱</span>
        <div id="question-text" class="question-text">Hewan apakah ini?</div>
        <div id="answer-grid" class="answer-grid"></div>
      </div>
    </div>
    <div id="feedback-overlay" class="feedback-overlay">
      <div id="feedback-box" class="feedback-box correct-fb">
        <span id="feedback-emoji" class="feedback-emoji">✅</span>
        <div id="feedback-text" class="feedback-text">Hebat!</div>
      </div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="screen-result" class="screen">
    <div id="result-confetti" class="result-confetti"></div>
    <div class="result-content">
      <div id="result-mascot" class="result-mascot">🏆</div>
      <div id="result-title" class="result-title">Hebat!</div>
      <div id="result-stars" class="result-stars">
        <span class="star">⭐</span>
        <span class="star">⭐</span>
        <span class="star">⭐</span>
      </div>
      <div class="result-score-box">
        <div class="result-score-label">Nilaimu</div>
        <div id="result-score" class="result-score">5 / 5</div>
      </div>
      <div id="result-message" class="result-message">Kamu sangat pintar! 🎉</div>
      <div class="result-buttons">
        <button class="btn-retry" onclick="retryLevel()">🔄 Coba Lagi</button>
        <button class="btn-home-result" onclick="goHome()">🏠 Pilih Level</button>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="questions_v2.js"></script>
  <script src="game.js"></script>
</body>
</html>
