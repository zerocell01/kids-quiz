<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Edukatif Anak</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Screen: Pilih Umur -->
        <div id="ageScreen" class="screen active">
            <div class="content-wrapper">
                <div class="header-section">
                    <h1 class="main-title">🎮 Game Edukatif</h1>
                    <p class="subtitle">Belajar sambil bermain!</p>
                </div>

                <div class="age-section">
                    <p class="label">Pilih Umur Anak:</p>
                    <div class="age-buttons">
                        <button class="btn btn-age" onclick="selectAge('1-2')">
                            <span class="emoji">👶</span>
                            <span class="text">1-2 Tahun</span>
                        </button>
                        <button class="btn btn-age" onclick="selectAge('3-4')">
                            <span class="emoji">🧒</span>
                            <span class="text">3-4 Tahun</span>
                        </button>
                        <button class="btn btn-age" onclick="selectAge('5+')">
                            <span class="emoji">👦</span>
                            <span class="text">5+ Tahun</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Screen: Pilih Kategori -->
        <div id="categoryScreen" class="screen">
            <div class="content-wrapper">
                <div class="header-top">
                    <button class="btn-back" onclick="goBack()">
                        <span class="arrow">←</span> Kembali
                    </button>
                </div>

                <h2 class="screen-title">Pilih Kategori</h2>

                <div id="categoryContainer" class="category-grid"></div>
            </div>
        </div>

        <!-- Screen: Pilih Level -->
        <div id="levelScreen" class="screen">
            <div class="content-wrapper">
                <div class="header-top">
                    <button class="btn-back" onclick="goBack()">
                        <span class="arrow">←</span> Kembali
                    </button>
                </div>

                <h2 class="screen-title" id="levelTitle">Pilih Level</h2>

                <div class="level-buttons">
                    <button class="btn btn-level" onclick="selectLevel('mudah')">
                        <span class="stars">⭐</span>
                        <span class="level-name">Mudah</span>
                        <span class="level-desc">Untuk pemula</span>
                    </button>
                    <button class="btn btn-level" onclick="selectLevel('sedang')">
                        <span class="stars">⭐⭐</span>
                        <span class="level-name">Sedang</span>
                        <span class="level-desc">Lebih menantang</span>
                    </button>
                    <button class="btn btn-level" onclick="selectLevel('sulit')">
                        <span class="stars">⭐⭐⭐</span>
                        <span class="level-name">Sulit</span>
                        <span class="level-desc">Super menantang</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Screen: Permainan -->
        <div id="gameScreen" class="screen">
            <div class="content-wrapper">
                <div class="game-header">
                    <button class="btn-back" onclick="goBack()">
                        <span class="arrow">←</span>
                    </button>
                    <div class="progress-info">
                        <span id="questionNumber">1</span> / <span id="totalNumber">10</span>
                    </div>
                </div>

                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>

                <div class="game-content">
                    <h3 id="questionText" class="question-text">Pertanyaan di sini</h3>
                    
                    <div id="answersContainer" class="answers-container">
                        <div class="answer-image">
                            <img id="questionImage" src="" alt="Gambar soal">
                        </div>
                        <div id="answersGrid" class="answers-grid"></div>
                    </div>

                    <div id="feedbackBox" class="feedback-box hidden">
                        <div class="feedback-content">
                            <p id="feedbackText"></p>
                        </div>
                    </div>
                </div>

                <div class="game-footer">
                    <button id="nextBtn" class="btn btn-next hidden" onclick="nextQuestion()">
                        Lanjut <span class="arrow">→</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Screen: Hasil -->
        <div id="resultScreen" class="screen">
            <div class="content-wrapper">
                <div class="result-container">
                    <h2 class="result-title">🎉 Selesai!</h2>
                    
                    <div class="score-circle">
                        <div class="score-content">
                            <span id="finalScore" class="score-number">0</span>
                            <span class="score-slash">/</span>
                            <span id="totalQuestions" class="score-total">10</span>
                        </div>
                    </div>

                    <p id="resultMessage" class="result-message">Bagus sekali!</p>

                    <div class="result-actions">
                        <button class="btn btn-full" onclick="goToAge()">
                            Menu Utama
                        </button>
                        <button class="btn btn-full btn-secondary" onclick="location.reload()">
                            Mulai Ulang
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
