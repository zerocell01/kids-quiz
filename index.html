<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Edukatif Anak</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- SCREEN 1: PILIH UMUR -->
    <div id="ageScreen" class="screen active">
        <div class="screen-content">
            <h1>🎮 Game Edukatif</h1>
            <p class="subtitle">Belajar sambil bermain!</p>
            
            <div class="button-section">
                <p class="label">Pilih Umur Anak:</p>
                <button class="btn btn-large" onclick="selectAge('1-2')">👶 1-2 Tahun</button>
                <button class="btn btn-large" onclick="selectAge('3-4')">🧒 3-4 Tahun</button>
                <button class="btn btn-large" onclick="selectAge('5+')">👦 5+ Tahun</button>
            </div>
        </div>
    </div>

    <!-- SCREEN 2: PILIH KATEGORI -->
    <div id="categoryScreen" class="screen">
        <div class="screen-content">
            <div class="top-bar">
                <button class="btn btn-small" onclick="goBack()">← Kembali</button>
            </div>
            <h2>Pilih Kategori</h2>
            <div id="categoryContainer" class="grid-2"></div>
        </div>
    </div>

    <!-- SCREEN 3: PILIH LEVEL -->
    <div id="levelScreen" class="screen">
        <div class="screen-content">
            <div class="top-bar">
                <button class="btn btn-small" onclick="goBack()">← Kembali</button>
            </div>
            <h2 id="levelTitle">Pilih Level</h2>
            <div class="button-section">
                <button class="btn btn-level" onclick="selectLevel('mudah')">
                    ⭐ Mudah <br><small>Untuk pemula</small>
                </button>
                <button class="btn btn-level" onclick="selectLevel('sedang')">
                    ⭐⭐ Sedang <br><small>Lebih menantang</small>
                </button>
                <button class="btn btn-level" onclick="selectLevel('sulit')">
                    ⭐⭐⭐ Sulit <br><small>Super menantang</small>
                </button>
            </div>
        </div>
    </div>

    <!-- SCREEN 4: GAME -->
    <div id="gameScreen" class="screen">
        <div class="screen-content">
            <div class="top-bar">
                <button class="btn btn-small" onclick="goBack()">← Kembali</button>
                <span id="counter" class="counter">1/10</span>
            </div>
            
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>

            <h3 id="questionText" class="question">Pertanyaan?</h3>
            
            <div class="image-box">
                <img id="questionImage" src="" alt="Gambar soal">
            </div>

            <div id="answersGrid" class="grid-2 answers"></div>

            <div id="feedback" class="feedback hidden">
                <p id="feedbackText"></p>
            </div>

            <div class="button-section">
                <button id="nextBtn" class="btn btn-large hidden" onclick="nextQuestion()">
                    Lanjut →
                </button>
            </div>
        </div>
    </div>

    <!-- SCREEN 5: HASIL -->
    <div id="resultScreen" class="screen">
        <div class="screen-content">
            <h2>🎉 Selesai!</h2>
            
            <div class="score-box">
                <div class="score">
                    <span id="finalScore">0</span> / <span id="totalQuestions">10</span>
                </div>
            </div>
            
            <p id="resultMessage" class="result-message">Bagus sekali!</p>
            
            <div class="button-section">
                <button class="btn btn-large" onclick="goToAge()">Menu Utama</button>
                <button class="btn btn-large" onclick="location.reload()">Mulai Ulang</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
