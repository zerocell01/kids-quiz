<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Edukatif Anak</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HOME -->
  <section id="homeScreen" class="screen active">

    <div class="home-card">

      <div class="logo">
        <h1>GAME<br>EDUKATIF</h1>
        <p>Belajar sambil bermain! ✨</p>
      </div>

      <button class="main-btn" onclick="showCategory()">
        Mulai Main
      </button>

    </div>

  </section>

  <!-- CATEGORY -->
  <section id="categoryScreen" class="screen">

    <div class="container">

      <div class="top-header">
        <button class="back-btn" onclick="goHome()">
          ← Kembali
        </button>
      </div>

      <h2 class="page-title">Pilih Kategori</h2>

      <div class="category-grid" id="categoryGrid"></div>

    </div>

  </section>

  <!-- QUIZ -->
  <section id="quizScreen" class="screen">

    <div class="container">

      <div class="quiz-top">

        <button class="back-btn" onclick="showCategory()">
          ← Kembali
        </button>

        <div class="quiz-badge">
          ⭐ <span id="questionNumber">1/5</span>
        </div>

        <div class="quiz-badge">
          Poin: <span id="scoreText">0</span>
        </div>

      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="quiz-card">

        <div class="quiz-label">
          SOAL <span id="currentQuestionText">1</span>
        </div>

        <h2 id="questionText">
          Apa nama hewan ini?
        </h2>

        <img
          id="questionImage"
          class="question-image"
          src=""
          alt="gambar quiz"
        />

        <div class="answers" id="answersContainer"></div>

      </div>

    </div>

  </section>

  <!-- RESULT -->
  <section id="resultScreen" class="screen">

    <div class="result-card">

      <h2>🎉 Hebat!</h2>

      <p>Skor Kamu</p>

      <h1 id="finalScore">0</h1>

      <button class="main-btn" onclick="showCategory()">
        Main Lagi
      </button>

    </div>

  </section>

  <script src="script.js"></script>

  <!-- AUDIO -->

<audio id="correctSound">
  <source src="assets/audio/correct.mp3" type="audio/mp3">
</audio>

<audio id="wrongSound">
  <source src="assets/audio/wrong.mp3" type="audio/mp3">
</audio>

<audio id="bgMusic" loop>
  <source src="assets/audio/bg-music.mp3" type="audio/mp3">
</audio>

<!-- BINTANG -->
<div id="starContainer"></div>
</body>
</html>
