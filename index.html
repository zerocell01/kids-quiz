<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Edukatif Anak</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- SCREEN 1: PILIH UMUR -->
    <div id="ageScreen" class="screen active">
        <div class="container">
            <div class="title-section">
                <div class="big-emoji">🎮</div>
                <h1>Game Edukatif</h1>
                <p class="subtitle">Belajar sambil bermain!</p>
            </div>
            
            <div class="age-cards">
                <button class="age-card" onclick="selectAge('1-2')">
                    <div class="card-emoji">👶</div>
                    <div class="card-title">1-2 Tahun</div>
                    <div class="card-desc">Bayi Cerdas</div>
                </button>
                <button class="age-card" onclick="selectAge('3-4')">
                    <div class="card-emoji">🧒</div>
                    <div class="card-title">3-4 Tahun</div>
                    <div class="card-desc">Anak Aktif</div>
                </button>
                <button class="age-card" onclick="selectAge('5+')">
                    <div class="card-emoji">👦</div>
                    <div class="card-title">5+ Tahun</div>
                    <div class="card-desc">Anak Pintar</div>
                </button>
            </div>
        </div>
    </div>

    <!-- SCREEN 2: PILIH KATEGORI -->
    <div id="categoryScreen" class="screen">
        <div class="container">
            <div class="header">
                <button class="btn-back" onclick="goBack()">← Kembali</button>
                <h2>Pilih Kategori</h2>
            </div>
            
            <div id="categoryContainer" class="category-grid"></div>
        </div>
    </div>

    <!-- SCREEN 3: PILIH LEVEL -->
    <div id="levelScreen" class="screen">
        <div class="container">
            <div class="header">
                <button class="btn-back" onclick="goBack()">← Kembali</button>
                <h2 id="levelTitle">Pilih Level</h2>
            </div>
            
            <div class="level-cards">
                <button class="level-card level-easy" onclick="selectLevel('mudah')">
                    <div class="level-stars">⭐</div>
                    <div class="level-name">Mudah</div>
                    <div class="level-emoji">😊</div>
                    <div class="level-desc">Untuk pemula</div>
                </button>
                <button class="level-card level-medium" onclick="selectLevel('sedang')">
                    <div class="level-stars">⭐⭐</div>
                    <div class="level-name">Sedang</div>
                    <div class="level-emoji">🔥</div>
                    <div class="level-desc">Lebih menantang</div>
                </button>
                <button class="level-card level-hard" onclick="selectLevel('sulit')">
                    <div class="level-stars">⭐⭐⭐</div>
                    <div class="level-name">Sulit</div>
                    <div class="level-emoji">💪</div>
                    <div class="level-desc">Super menantang</div>
                </button>
            </div>
        </div>
    </div>

    <!-- SCREEN 4: GAME -->
    <div id="gameScreen" class="screen">
        <div class="container">
            <div class="game-header">
                <button class="btn-back" onclick="goBack()">← Kembali</button>
                <div class="game-info">
                    <span id="counter" class="counter">1/10</span>
                    <div class="score-display">
                        <span class="score-label">Poin:</span>
                        <span id="gameScore" class="score-value">0</span>
                    </div>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <p class="progress-text">Progres: <span id="progressPercent">0</span>%</p>
            </div>

            <div class="game-content">
                <div class="question-box">
                    <h3 id="questionText">Pertanyaan?</h3>
                </div>

                <div class="image-container">
                    <div class="image-box">
                        <img id="questionImage" src="" alt="Gambar soal">
                    </div>
                </div>

                <div id="answersGrid" class="answers-grid"></div>

                <div id="feedback" class="feedback hidden">
                    <div class="feedback-content">
                        <span id="feedbackEmoji" class="feedback-emoji"></span>
                        <p id="feedbackText"></p>
                    </div>
                </div>

                <button id="nextBtn" class="btn-next hidden" onclick="nextQuestion()">
                    Lanjut →
                </button>
            </div>
        </div>
    </div>

    <!-- SCREEN 5: HASIL -->
    <div id="resultScreen" class="screen">
        <div class="container result-container">
            <div class="result-header">
                <div id="resultEmoji" class="result-emoji">🎉</div>
                <h2>Selesai!</h2>
            </div>

            <div class="result-score">
                <div class="big-score">
                    <span id="finalScore">0</span>
                    <span class="slash">/</span>
                    <span id="totalQuestions">10</span>
                </div>
            </div>

            <div class="result-rating">
                <p id="resultMessage" class="result-message">Bagus sekali!</p>
                <p id="resultDesc" class="result-desc">Teruskan semangatmu!</p>
            </div>

            <div class="result-actions">
                <button class="btn-action btn-menu" onclick="goToAge()">
                    🏠 Menu Utama
                </button>
                <button class="btn-action btn-retry" onclick="location.reload()">
                    🔄 Mulai Ulang
                </button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
