<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Edukatif Anak</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- SCREEN 1: PILIH UMUR -->
    <div id="ageScreen" class="screen active">
        <div class="age-bg">
            <svg class="cloud" style="left: 10%; top: 5%;" viewBox="0 0 100 50">
                <path d="M 20 30 Q 10 30 10 20 Q 10 10 20 10 Q 30 5 40 10 Q 50 5 60 15 Q 70 10 75 20 Q 80 30 70 35 Q 60 40 50 35 Q 40 40 30 35 Q 20 40 20 30 Z" fill="white"/>
            </svg>
            <svg class="cloud" style="right: 5%; top: 15%;" viewBox="0 0 100 50">
                <path d="M 20 30 Q 10 30 10 20 Q 10 10 20 10 Q 30 5 40 10 Q 50 5 60 15 Q 70 10 75 20 Q 80 30 70 35 Q 60 40 50 35 Q 40 40 30 35 Q 20 40 20 30 Z" fill="white"/>
            </svg>
            
            <div class="container">
                <div class="title-section">
                    <div class="title-wrapper">
                        <h1 class="main-title">GAME<br>EDUKATIF</h1>
                        <div class="star-emoji">⭐</div>
                    </div>
                    <p class="subtitle">Belajar sambil bermain!</p>
                </div>
                
                <div class="age-cards">
                    <button class="age-card age-card-pink" onclick="selectAge('1-2')">
                        <div class="card-left">
                            <span class="age-emoji">👶</span>
                            <div>
                                <div class="age-title">1-2 Tahun</div>
                                <div class="age-desc">Bayi Cerdas</div>
                            </div>
                        </div>
                        <div class="card-arrow">→</div>
                    </button>
                    <button class="age-card age-card-orange" onclick="selectAge('3-4')">
                        <div class="card-left">
                            <span class="age-emoji">🧒</span>
                            <div>
                                <div class="age-title">3-4 Tahun</div>
                                <div class="age-desc">Anak Aktif</div>
                            </div>
                        </div>
                        <div class="card-arrow">→</div>
                    </button>
                    <button class="age-card age-card-green" onclick="selectAge('5+')">
                        <div class="card-left">
                            <span class="age-emoji">👦</span>
                            <div>
                                <div class="age-title">5+ Tahun</div>
                                <div class="age-desc">Anak Pintar</div>
                            </div>
                        </div>
                        <div class="card-arrow">→</div>
                    </button>
                </div>
            </div>

            <div class="landscape-bottom">
                <svg class="grass" viewBox="0 0 400 100">
                    <path d="M 0 50 Q 50 30 100 50 T 200 50 T 300 50 T 400 50 L 400 100 L 0 100 Z" fill="#7EC850"/>
                    <ellipse cx="50" cy="45" rx="8" ry="10" fill="#95D947"/>
                    <ellipse cx="150" cy="48" rx="6" ry="8" fill="#95D947"/>
                    <ellipse cx="250" cy="46" rx="7" ry="9" fill="#95D947"/>
                    <ellipse cx="350" cy="49" rx="6" ry="8" fill="#95D947"/>
                </svg>
                <div class="cat-mascot">🐱</div>
            </div>
        </div>
    </div>

    <!-- SCREEN 2: PILIH KATEGORI -->
    <div id="categoryScreen" class="screen">
        <div class="category-bg">
            <svg class="cloud" style="top: 5%; right: 5%;" viewBox="0 0 100 50">
                <path d="M 20 30 Q 10 30 10 20 Q 10 10 20 10 Q 30 5 40 10 Q 50 5 60 15 Q 70 10 75 20 Q 80 30 70 35 Q 60 40 50 35 Q 40 40 30 35 Q 20 40 20 30 Z" fill="white"/>
            </svg>
            <svg class="sun" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="30" fill="#FFD93D"/>
                <circle cx="50" cy="50" r="25" fill="#FFEB3B"/>
                <path d="M 50 10 L 50 5 M 90 50 L 95 50 M 10 50 L 5 50 M 75 25 L 78 22 M 25 75 L 22 78 M 75 75 L 78 78 M 25 25 L 22 22" stroke="#FFD93D" stroke-width="3" stroke-linecap="round"/>
            </svg>

            <div class="container">
                <div class="header">
                    <button class="btn-back" onclick="goBack()">← Kembali</button>
                    <h2>Pilih Kategori</h2>
                </div>
                
                <div id="categoryContainer" class="category-grid"></div>
            </div>

            <div class="landscape-bottom landscape-light">
                <svg class="grass" viewBox="0 0 400 80">
                    <path d="M 0 40 Q 50 20 100 40 T 200 40 T 300 40 T 400 40 L 400 80 L 0 80 Z" fill="#A8D947"/>
                </svg>
            </div>
        </div>
    </div>

    <!-- SCREEN 3: PILIH LEVEL -->
    <div id="levelScreen" class="screen">
        <div class="level-bg">
            <div class="container">
                <div class="header">
                    <button class="btn-back" onclick="goBack()">← Kembali</button>
                    <h2 id="levelTitle">Pilih Level</h2>
                </div>
                
                <div class="level-cards">
                    <button class="level-card level-easy" onclick="selectLevel('mudah')">
                        <div class="level-content">
                            <div class="level-left">
                                <div class="level-stars">⭐</div>
                                <div>
                                    <div class="level-name">Mudah</div>
                                    <div class="level-desc">Untuk pemula</div>
                                </div>
                            </div>
                            <div class="level-emoji">😊</div>
                        </div>
                    </button>
                    <button class="level-card level-medium" onclick="selectLevel('sedang')">
                        <div class="level-content">
                            <div class="level-left">
                                <div class="level-stars">⭐⭐</div>
                                <div>
                                    <div class="level-name">Sedang</div>
                                    <div class="level-desc">Lebih menantang</div>
                                </div>
                            </div>
                            <div class="level-emoji">🔥</div>
                        </div>
                    </button>
                    <button class="level-card level-hard" onclick="selectLevel('sulit')">
                        <div class="level-content">
                            <div class="level-left">
                                <div class="level-stars">⭐⭐⭐</div>
                                <div>
                                    <div class="level-name">Sulit</div>
                                    <div class="level-desc">Super menantang</div>
                                </div>
                            </div>
                            <div class="level-emoji">💪</div>
                        </div>
                    </button>
                </div>
            </div>

            <div class="landscape-bottom landscape-light">
                <svg class="grass" viewBox="0 0 400 100">
                    <path d="M 0 50 Q 50 30 100 50 T 200 50 T 300 50 T 400 50 L 400 100 L 0 100 Z" fill="#A8D947"/>
                    <circle cx="80" cy="30" r="4" fill="#FFD93D"/>
                    <circle cx="200" cy="25" r="3" fill="#FFD93D"/>
                    <circle cx="320" cy="35" r="4" fill="#FFD93D"/>
                </svg>
            </div>
        </div>
    </div>

    <!-- SCREEN 4: GAME -->
    <div id="gameScreen" class="screen">
        <div class="game-bg">
            <div class="container">
                <div class="game-header">
                    <button class="btn-back" onclick="goBack()">← Kembali</button>
                    <div class="game-stats">
                        <span class="counter">
                            <span class="star-icon">⭐</span>
                            <span id="counter">1/10</span>
                        </span>
                        <span class="score-display">
                            Poin: <span id="gameScore">0</span>
                        </span>
                    </div>
                </div>

                <div class="progress-container">
                    <div class="progress-bar">
                        <div id="progressFill" class="progress-fill"></div>
                    </div>
                </div>

                <div class="game-content">
                    <div class="question-box">
                        <div class="question-label">SOAL <span id="questionNum">1</span></div>
                        <h3 id="questionText">Pertanyaan?</h3>
                    </div>

                    <div class="image-container">
                        <div class="image-box">
                            <img id="questionImage" src="" alt="Gambar soal">
                        </div>
                    </div>

                    <div id="answersGrid" class="answers-grid"></div>

                    <div id="feedback" class="feedback hidden">
                        <div class="feedback-content">
                            <span id="feedbackEmoji" class="feedback-emoji"></span>
                            <p id="feedbackText"></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="landscape-bottom landscape-light">
                <svg class="grass" viewBox="0 0 400 60">
                    <path d="M 0 30 Q 50 15 100 30 T 200 30 T 300 30 T 400 30 L 400 60 L 0 60 Z" fill="#A8D947"/>
                </svg>
            </div>
        </div>
    </div>

    <!-- SCREEN 5: HASIL -->
    <div id="resultScreen" class="screen">
        <div class="result-bg">
            <svg class="cloud" style="top: 10%; left: 5%;" viewBox="0 0 100 50">
                <path d="M 20 30 Q 10 30 10 20 Q 10 10 20 10 Q 30 5 40 10 Q 50 5 60 15 Q 70 10 75 20 Q 80 30 70 35 Q 60 40 50 35 Q 40 40 30 35 Q 20 40 20 30 Z" fill="white"/>
            </svg>

            <div class="container result-container">
                <div class="result-header">
                    <div id="resultEmoji" class="result-emoji">🎉</div>
                    <h2>Selesai!</h2>
                </div>

                <div class="result-score-box">
                    <div class="result-score">
                        <span id="finalScore">0</span>
                        <span class="slash">/</span>
                        <span id="totalQuestions">10</span>
                    </div>
                </div>

                <div class="result-rating">
                    <p id="resultMessage" class="result-message">Bagus sekali!</p>
                    <p id="resultDesc" class="result-desc">Teruskan semangatmu!</p>
                </div>

                <div class="result-actions">
                    <button class="btn-action btn-menu" onclick="goToAge()">
                        🏠 Menu Utama
                    </button>
                    <button class="btn-action btn-retry" onclick="location.reload()">
                        🔄 Mulai Ulang
                    </button>
                </div>
            </div>

            <div class="landscape-bottom landscape-light">
                <svg class="grass" viewBox="0 0 400 100">
                    <path d="M 0 50 Q 50 30 100 50 T 200 50 T 300 50 T 400 50 L 400 100 L 0 100 Z" fill="#A8D947"/>
                </svg>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
